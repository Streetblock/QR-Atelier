<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaxiCode Template Editor</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5f0;
      --panel: #ffffff;
      --line: #d7d4cd;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --black: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(520px, 1.2fr) minmax(320px, 0.8fr);
      gap: 16px;
      min-height: 100vh;
      padding: 16px;
    }

    .stage,
    .sidebar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 0;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: auto;
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
      padding: 14px;
    }

    .toolbar,
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
    }

    button.active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.12) inset;
    }

    button:hover {
      border-color: #b7c0cf;
    }

    textarea {
      width: 100%;
      min-height: 100%;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font: 12px/1.4 Consolas, "Courier New", monospace;
      color: var(--text);
      background: #fcfcfd;
      white-space: pre;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    svg {
      width: min(94vmin, 980px);
      height: auto;
      display: block;
    }

    .cell {
      cursor: pointer;
    }

    .cell.clear {
      fill: rgba(255, 255, 255, 0);
      stroke: rgba(17, 24, 39, 0.16);
      stroke-width: 1.2;
      stroke-dasharray: 3 2;
    }

    .cell.white {
      fill: #ffffff;
      stroke: rgba(17, 24, 39, 0.48);
      stroke-width: 1.4;
    }

    .cell.black {
      fill: #111827;
      stroke: #111827;
      stroke-width: 1.2;
    }

    .cell.illegal {
      fill: rgba(37, 99, 235, 0.18);
      stroke: #3b82f6;
      stroke-width: 1.8;
      stroke-dasharray: 4 3;
    }

    .bullseye-ring {
      fill: #111827;
    }

    .bullseye-hole {
      fill: #ffffff;
    }

    .legend {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid var(--line);
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    .swatch.black { background: #111827; }
    .swatch.white { background: #ffffff; }
    .swatch.clear { background: transparent; }
    .swatch.illegal { background: rgba(37, 99, 235, 0.18); border-color: #3b82f6; }

    @media (max-width: 1100px) {
      .shell {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="stage">
      <svg id="canvas" aria-label="MaxiCode Template Editor"></svg>
    </div>

    <aside class="sidebar">
      <div>
        <div class="toolbar" id="mode-toolbar">
          <button type="button" data-mode="black" class="active">Black</button>
          <button type="button" data-mode="white">White</button>
          <button type="button" data-mode="illegal">Illegal</button>
          <button type="button" data-mode="clear">Clear</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="btn-reset">Reset</button>
        <button type="button" id="btn-copy">Copy</button>
      </div>

      <textarea id="export" readonly spellcheck="false"></textarea>

      <div class="hint">
        <div><span class="swatch black"></span>Black fixed cells</div>
        <div><span class="swatch white"></span>White fixed cells</div>
        <div><span class="swatch illegal"></span>Illegal cells</div>
        <div><span class="swatch clear"></span>Unset cells</div>
      </div>
    </aside>
  </div>

  <script type="module" src="./maxicode-template-editor.js"></script>
</body>
</html>
