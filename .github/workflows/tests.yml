name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install JavaScript test dependencies
        run: npm install --ignore-scripts

      - name: Install Data Matrix reference decoder
        if: ${{ hashFiles('reference-tests/datamatrix-roundtrip-zxing.mjs') != '' }}
        run: npm install --no-save --ignore-scripts @zxing/library@0.23.0

      - name: Install Python reference-test dependencies
        if: ${{ hashFiles('requirements-test.txt') != '' }}
        run: python -m pip install -r requirements-test.txt

      - name: Run unit and structure tests
        run: npm test

      - name: Run reference tests when configured
        run: npm run test:reference --if-present
